<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>W100 screen replica</title>
<!-- Faithful replica of the Temtop W100 7" screen pages (from the official user manual V1.0):
     air-quality page, PM2.5 history bar chart, 7-day forecast, alert settings.
     Logical size 1024x600 (the 7" panel), animated deterministically by renderFrame(t). -->
<link rel="stylesheet" href="fonts/local.css">
<style>
:root{--bg:#060607;--panel:#17181b;--panel2:#1d1e22;--line:#2a2b30;--txt:#f2f2f2;--sub:#9a9ba0;--org:#f2873a;--grn:#37c25b;--ora:#f39233;--red:#ef4040}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1024px;height:600px;overflow:hidden;background:#000}
body{font-family:'Barlow Semi Condensed',sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased}
.scr{position:absolute;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 30% 0%,#17181b 0%,#0b0b0c 45%,#050505 100%)}
.scr.light{background:#eceef1;color:#2b2d33}
.hdr{position:absolute;left:0;right:0;top:0;height:64px}
.time{position:absolute;left:28px;top:20px;font-weight:500;font-size:24px;letter-spacing:.3px}
.pill{position:absolute;left:170px;top:20px;height:32px;width:160px;text-align:center;border-radius:16px;background:var(--org);color:#fff;font-weight:600;font-size:21px;line-height:32px}
.dots{position:absolute;left:459.5px;top:32.5px;display:flex;gap:18.5px}
.dots i{width:9px;height:9px;border-radius:50%;background:#6f7075}
.dots i.on{background:#fff}
.icons{position:absolute;right:26px;top:19px;display:flex;gap:18px;align-items:center}
.icons svg{display:block}
.back{position:absolute;left:28px;top:20px;font-size:24px;font-weight:500;color:#c9cacf}
/* air quality page */
.big{position:absolute;left:40px;top:118px;height:120px;display:flex;align-items:center}
.bar{width:9px;height:88px;border-radius:5px;background:var(--grn);margin-right:14px}
.bigv{font-weight:700;font-size:124px;line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.pmlbl{position:absolute;left:362px;top:138px;width:90px;text-align:center}
.pmlbl .ic{width:40px;height:40px;border-radius:50%;background:#2b2c30;margin:0 auto 10px}
.pmlbl b{display:block;font-size:27px;font-weight:700}
.pmlbl small{font-size:13px;color:var(--sub)}
.adv{position:absolute;left:494px;top:112px;width:492px}
.adv h3{font-size:29px;font-weight:600;display:flex;align-items:center;gap:12px;color:#dedfe3}
.adv p{margin-top:18px;font-size:19px;line-height:1.3;color:#b9babe;font-weight:500}
.tiles{position:absolute;left:24px;top:300px;width:976px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px 26px}
.tile{position:relative;height:112px;border-radius:16px;background:linear-gradient(180deg,#1b1c20,#141518);box-shadow:inset 0 0 0 1.5px #24252a}
.tile .d{position:absolute;left:26px;top:47px;width:20px;height:20px;border-radius:50%;background:var(--grn)}
.tile .v{position:absolute;left:62px;top:24px;font-weight:600;font-size:54px;line-height:1;font-variant-numeric:tabular-nums}
.tile .l{position:absolute;right:22px;top:26px;text-align:right;font-weight:600;font-size:22px;color:#d6d7db;line-height:1}
.tile .l small{display:block;margin-top:5px;font-size:13px;color:var(--sub);font-weight:500}
.tile .al{position:absolute;right:24px;bottom:14px;opacity:0}
/* chart page */
.panel{position:absolute;left:18px;top:66px;width:988px;height:520px;border-radius:18px;background:#131417;box-shadow:inset 0 0 0 1.5px #1f2024}
.ch-h{position:absolute;left:40px;top:28px;font-size:30px;font-weight:700}
.ch-h small{font-size:14px;color:var(--sub);font-weight:500;margin-left:6px}
.now{position:absolute;left:330px;top:30px;font-size:28px;font-weight:600}
.now span{color:#c8c9cd}
.tog{position:absolute;right:120px;top:22px;width:190px;height:48px;border-radius:10px;background:#1f2024;display:flex;align-items:center;padding:4px}
.tog div{flex:1;height:100%;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;color:#8d8e93}
.tog .a{background:#2c2d32;color:var(--org)}
.sel{position:absolute;top:92px;display:flex;align-items:center;height:48px;border-radius:10px;background:#0d0d0f;box-shadow:inset 0 0 0 1.5px #24252a;font-size:24px;font-weight:600}
.sel b{width:40px;text-align:center;color:#c9cacf;font-weight:500}
.sel span{width:80px;text-align:center}
.leg{position:absolute;right:120px;top:96px;font-size:17px;line-height:1.35;color:#d9dadd}
.leg i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--org);margin-right:8px;vertical-align:2px}
.leg em{font-style:normal;color:var(--org);margin-right:6px}
.chart{position:absolute;left:40px;top:160px;width:910px;height:320px}
/* forecast */
.loc{position:absolute;left:30px;top:76px;font-size:21px;font-weight:500;display:flex;gap:8px;align-items:center}
.wdate{position:absolute;left:182px;top:168px;font-size:30px;font-weight:500}
.wtemp{position:absolute;left:36px;top:250px;font-size:120px;font-weight:600;line-height:1;letter-spacing:-1px}
.wtemp small{font-size:72px;font-weight:400;margin-left:34px}
.waq{position:absolute;left:36px;top:420px;font-size:23px;font-weight:600;color:#d7d8dc;display:flex;gap:40px}
.fcp{position:absolute;left:452px;top:62px;width:552px;height:470px;border-radius:16px;background:rgba(30,31,35,.72)}
.fcp h4{position:absolute;left:26px;top:20px;font-size:24px;font-weight:600;color:#a5a6ab}
.row{position:absolute;left:16px;width:520px;height:48px;border-radius:9px;background:#26272b;display:flex;align-items:center;font-size:21px;font-weight:500;color:#a9aaaf}
.row .dn{width:110px;padding-left:22px;color:#c3c4c8}
.row .wi{width:60px;display:flex;justify-content:center}
.row .mn{width:170px;text-align:right}
.row .mx{width:170px;text-align:right}
.row b{color:#e6e7ea;font-weight:600}
/* alerts (light theme) */
.lpanel{position:absolute;left:18px;top:66px;width:988px;height:520px;border-radius:18px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.lt{position:absolute;left:36px;top:24px;font-size:28px;font-weight:700;display:flex;align-items:center;gap:12px;color:#2b2d33}
.reset{position:absolute;right:30px;top:20px;height:40px;padding:0 22px;border-radius:9px;background:#fff1e6;color:var(--org);font-size:21px;font-weight:600;line-height:40px;box-shadow:inset 0 0 0 1.5px #ffd2b0}
.mxh{position:absolute;left:452px;top:80px;font-size:20px;font-weight:600;color:#55575e}
.arow{position:absolute;left:0;width:988px;height:62px;display:flex;align-items:center}
.arow .n{width:420px;text-align:right;padding-right:26px;font-size:24px;font-weight:600;color:#3a3c42}
.arow .n small{font-size:15px;color:#8b8d93;font-weight:500;margin-left:4px}
.inp{width:150px;height:44px;border-radius:7px;background:#fff;box-shadow:inset 0 0 0 1.5px #d6d8dd;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:600;color:#2b2d33;font-variant-numeric:tabular-nums}
.sw{width:60px;height:32px;border-radius:16px;background:#cfd2d8;position:relative;margin-left:26px}
.sw i{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--org)}
.sw.on i{left:32px}

/* home (weather) page, from the manual's home-screen capture */
.dpill{position:absolute;left:389px;top:66px;width:247px;height:38px;border-radius:19px;background:#1c1d21;color:#a4a5aa;font-size:17px;font-weight:500;line-height:38px;padding-left:24px;letter-spacing:.4px}
.dpill svg{position:absolute;right:20px;top:11px}
.sep{position:absolute;height:1.5px;background:#222327}
.hl{position:absolute;font-size:21px;font-weight:500;color:#ebebed;display:flex;align-items:center;gap:6px;white-space:nowrap}
.hv{position:absolute;display:flex;align-items:flex-start;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.hv .i{font-size:76px;letter-spacing:-1px}
.hv .u{display:flex;flex-direction:column;justify-content:space-between;height:60px;margin-left:5px;margin-top:4px}
.hv .u b{font-size:21px;font-weight:600;line-height:1}
.hv .u em{font-style:normal;font-size:25px;line-height:1}
.hv .tr{margin-left:3px;margin-top:44px}
.hv .pc{font-size:40px;font-weight:500;margin-left:6px;margin-top:30px}
.lbar{position:absolute;height:31px;border-radius:3px;background:linear-gradient(90deg,rgba(40,41,46,.15),#2a2b30 50%,rgba(40,41,46,.15));color:#8e8f95;font-size:15px;font-weight:600;letter-spacing:.6px;display:flex;align-items:center;justify-content:center;gap:7px;text-transform:uppercase}
.lbar.big{height:36px;font-size:24px;color:#b5b6bb;letter-spacing:.3px}
.mv{position:absolute;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.mv small{font-weight:500;color:#e2e2e5}
.cmp{position:absolute;left:371px;top:126px;width:286px;height:286px}
.ctx{position:absolute;text-align:center;color:#fff;line-height:1;font-variant-numeric:tabular-nums}
.sunl{position:absolute;font-size:22px;font-weight:500;color:#e0e0e3;line-height:1}
.sunv{position:absolute;font-size:30px;font-weight:600;color:#ecd27a;line-height:1;font-variant-numeric:tabular-nums}
.sunv small{font-size:13px;color:#b9b9bd;font-weight:500;margin-left:5px}
.srs{position:absolute;font-size:14px;font-weight:500;color:#a7a8ad;display:flex;align-items:center;gap:4px}
/* touch indicator */
#touch{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
</style>
</head>
<body>
<div id="root"></div>
<script>
const P=new URLSearchParams(location.search);
const PAGE=P.get('page')||'aq';     // aq | chart | forecast | alerts
const SCN=P.get('scene')||'good';   // aq: good | cook | co2 ; chart: cook
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const ss=u=>u*u*(3-2*u);
const pr=(t,a,b)=>clamp((t-a)/(b-a));
const C={grn:'#37c25b',ora:'#f39233',red:'#ef4040'};
// official reference levels (user manual V1.0, "Air Quality Parameter For Reference")
const LV={pm25:[9,55.4],pm10:[54.9,254.9],aqi:[50,150],co2:[1000,1500],tvoc:[100,350]};
const lvl=(k,v)=>v<=LV[k][0]?C.grn:v<=LV[k][1]?C.ora:C.red;
const comfT=v=>v>=20&&v<=26?C.grn:C.ora, comfRH=v=>v>=30&&v<=60?C.grn:C.ora;

const ICONS=`<div class="icons">
 ${PAGE==='forecast'?'<svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#eee"/><path d="M16 9c1.5 1.5 1.5 4.5 0 6" stroke="#eee" stroke-width="2" fill="none" stroke-linecap="round"/></svg>':'<svg width="22" height="22" viewBox="0 0 24 24"><path d="M3.5 11.5L12 4l8.5 7.5" stroke="#eee" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v10h12V10" stroke="#eee" stroke-width="2.2" fill="none" stroke-linejoin="round"/><rect x="10" y="13.5" width="4" height="6.5" fill="#eee"/></svg>'}
 <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5" fill="none" stroke="#eee" stroke-width="2.4"/><path d="M12 9v4.5l3 2" stroke="#eee" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M4 6l3-3M20 6l-3-3" stroke="#eee" stroke-width="2.2" stroke-linecap="round"/></svg>
 <svg width="24" height="20" viewBox="0 0 24 20"><path d="M2 7a14 14 0 0 1 20 0M5.5 10.5a9 9 0 0 1 13 0M9 14a4 4 0 0 1 6 0" stroke="#eee" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="12" cy="17" r="1.6" fill="#eee"/></svg>
 <svg width="34" height="18" viewBox="0 0 34 18"><rect x="1" y="2" width="28" height="14" rx="3" fill="none" stroke="#3ccb63" stroke-width="2"/><rect x="4" y="5" width="22" height="8" rx="1.5" fill="#3ccb63"/><rect x="30" y="6" width="3" height="6" rx="1" fill="#3ccb63"/></svg>
</div>`;
const ICONS_L=ICONS.replaceAll('#eee','#5b5d63');
const ALARM=(c='#ef4040')=>`<svg width="30" height="30" viewBox="0 0 24 24"><path d="M6 18v-6a6 6 0 0 1 12 0v6z" fill="${c}"/><rect x="4" y="18" width="16" height="3" rx="1" fill="${c}"/><path d="M12 2v2M4.5 5.5 6 7M19.5 5.5 18 7" stroke="${c}" stroke-width="2" stroke-linecap="round"/></svg>`;

const root=document.getElementById('root');
function header(pill,dotOn,light=false){
  return `<div class="hdr"><div class="time" style="${light?'color:#2b2d33':''}">${pill==='back'?'':(PAGE==='home'?(HOME[SCN]||HOME.morning).time:'09:00 PM')}</div>${pill&&pill!=='back'?`<div class="pill">${pill}</div>`:''}${pill==='back'?`<div class="back" style="${light?'color:#6a6c72':''}">&lsaquo; Back</div>`:''}
   ${dotOn>=0?`<div class="dots">${[0,1,2,3].map(i=>`<i class="${i===dotOn?'on':''}"></i>`).join('')}</div>`:''}${light?ICONS_L:ICONS}</div>`;
}

/* ---------- pages ---------- */
function buildAQ(){
  root.innerHTML=`<div class="scr">${header('Air Quality',2)}
   <div class="big"><div class="bar" id="bar"></div><div class="bigv" id="bigv">4.5</div></div>
   <div class="pmlbl"><div class="ic"></div><b>PM2.5</b><small>ug/m³</small></div>
   <div class="adv"><h3><svg width="26" height="26" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="#cfd0d4" stroke-width="2"/><path d="M7 9h10M7 13h10M7 17h6" stroke="#cfd0d4" stroke-width="2" stroke-linecap="round"/></svg>Health Advice</h3><p id="advice"></p></div>
   <div class="tiles">
    ${['pm10','aqi','co2','tvoc','temp','rh'].map(k=>`<div class="tile" id="t_${k}"><div class="d"></div><div class="v"></div><div class="l"></div><div class="al">${ALARM()}</div></div>`).join('')}
   </div><div id="touch"></div></div>`;
  const L={pm10:['PM10','ug/m³'],aqi:['AQI',''],co2:['CO₂','ppm'],tvoc:['TVOC',''],temp:['Temp','°C'],rh:['RH','%RH']};
  for(const k in L){const el=document.querySelector(`#t_${k} .l`); el.innerHTML=`${L[k][0]}${L[k][1]?`<small>${L[k][1]}</small>`:''}`;}
}
const ADV_GOOD='The air quality is excellent. During some outdoor sports is good for health.';
const ADV_PM='Activate air purifiers. Sensitive groups should monitor blood oxygen and heart rate, seeking medical attention promptly if abnormalities occur.';
function aqValues(t){
  // scene timelines (seconds within the insert clip)
  if(SCN==='cook'){ // pan on the stove: particles climb past the PM2.5 threshold set by the user
    const u=ss(pr(t,0.2,2.6));
    return {pm25:lerp(6.8,68.4,u),pm10:lerp(9.0,96.5,u),aqi:lerp(28,157,u),co2:lerp(712,868,u),tvoc:lerp(58,214,u),temp:lerp(22.4,23.1,u),rh:lerp(46.2,55.0,u),alarm:t>2.0};
  }
  if(SCN==='co2'){ // closed office, CO2 builds up
    const u=ss(pr(t,0.2,2.6));
    return {pm25:4.6,pm10:6.1,aqi:19,co2:lerp(1062,1538,u),tvoc:lerp(71,92,u),temp:22.8,rh:48.3,alarm:t>2.0};
  }
  return {pm25:4.5,pm10:5.0,aqi:19,co2:lerp(602,606,pr(t,0,3)),tvoc:62,temp:21.6,rh:48.3,alarm:false};
}
function drawAQ(t){
  const v=aqValues(t);
  const pmc=lvl('pm25',v.pm25);
  document.getElementById('bigv').textContent=v.pm25.toFixed(1);
  document.getElementById('bar').style.background=pmc;
  document.getElementById('advice').textContent=v.pm25>9?ADV_PM:ADV_GOOD;
  const set=(k,txt,col,al)=>{const el=document.getElementById('t_'+k);el.querySelector('.v').textContent=txt;el.querySelector('.d').style.background=col;
    el.querySelector('.al').style.opacity=al?(Math.sin(t*2*Math.PI*2)>0?1:0.15):0;};
  set('pm10',v.pm10.toFixed(1),lvl('pm10',v.pm10),false);
  set('aqi',Math.round(v.aqi),lvl('aqi',v.aqi),false);
  set('co2',Math.round(v.co2),lvl('co2',v.co2),SCN==='co2'&&v.alarm);
  set('tvoc',Math.round(v.tvoc),lvl('tvoc',v.tvoc),false);
  set('temp',v.temp.toFixed(1),comfT(v.temp),false);
  set('rh',v.rh.toFixed(1),comfRH(v.rh),false);
  // PM2.5 over the user's threshold: the alarm icon flashes next to the big reading
  let al=document.getElementById('bigal');
  if(!al){al=document.createElement('div');al.id='bigal';al.style.cssText='position:absolute;left:300px;top:126px;opacity:0';al.innerHTML=ALARM();document.querySelector('.scr').appendChild(al);}
  al.style.opacity=(SCN==='cook'&&v.alarm)?(Math.sin(t*2*Math.PI*2)>0?1:0.15):0;
}

function buildChart(){
  root.innerHTML=`<div class="scr">${header('back',-1)}
   <div class="panel">
    <div class="ch-h">PM2.5<small>ug/m³</small></div><div class="now"><span>NOW:</span> <b id="now">6.0</b></div>
    <div class="tog"><div class="a">Day</div><div>Month</div></div>
    <div class="sel" style="left:40px;width:180px"><b>&lsaquo;</b><span>2026</span><b>&rsaquo;</b></div>
    <div class="sel" style="left:236px;width:160px"><b>&lsaquo;</b><span style="width:80px">10</span><b>&rsaquo;</b></div>
    <div class="sel" style="left:412px;width:160px"><b>&lsaquo;</b><span style="width:80px">01</span><b>&rsaquo;</b></div>
    <div class="leg"><div><i></i><em>min</em><b id="mn">3.8</b></div><div><i></i><em>max</em><b id="mx">71.6</b></div></div>
    <svg class="chart" id="chart" viewBox="0 0 910 320"></svg>
   </div><div id="touch"></div></div>`;
}
// one day of PM2.5 (hourly): clean air all day, cooking spike in the evening, back down after airing
const DAY=[4.2,3.9,3.8,3.9,4.1,4.4,5.0,7.6,8.4,6.1,5.2,5.0,8.8,11.6,7.2,5.4,5.1,5.9,9.8,44.6,71.6,38.2,12.4,6.0];
function drawChart(t){
  const svg=document.getElementById('chart');
  const ymax=80, H=270, top=20, left=70, w=830, bw=w/24;
  let s='';
  [[ymax,'80.0'],[ymax/2,'40.0'],[0,'0.0']].forEach(([v,l])=>{const y=top+H-(v/ymax)*H;
    s+=`<text x="0" y="${y+7}" fill="#e6e7ea" font-size="20" font-weight="600" font-family="Barlow Semi Condensed">${l}</text><line x1="${left}" x2="${left+w}" y1="${y}" y2="${y}" stroke="#2c2d31" stroke-width="1.5"/>`;});
  DAY.forEach((v,i)=>{const g=ss(pr(t,0.15+i*0.035,0.55+i*0.035)); const h=(v/ymax)*H*g; const x=left+i*bw+bw*0.22;
    s+=`<rect x="${x.toFixed(1)}" y="${(top+H-h).toFixed(1)}" width="${(bw*0.56).toFixed(1)}" height="${h.toFixed(1)}" fill="${lvl('pm25',v)}"/>`;
    if(i%3===0) s+=`<text x="${(left+i*bw+bw/2).toFixed(1)}" y="${top+H+24}" fill="#8d8e93" font-size="13" text-anchor="middle" font-family="Barlow Semi Condensed">${String(i).padStart(2,'0')}:00</text>`;});
  svg.innerHTML=s;
}

const WX={sun:`<svg width="34" height="34" viewBox="0 0 34 34"><g stroke="#f7b733" stroke-width="2.6" stroke-linecap="round">${[0,45,90,135,180,225,270,315].map(a=>{const r=a*Math.PI/180;return `<line x1="${17+11*Math.cos(r)}" y1="${17+11*Math.sin(r)}" x2="${17+15*Math.cos(r)}" y2="${17+15*Math.sin(r)}"/>`}).join('')}</g><circle cx="17" cy="17" r="7.5" fill="#f9a826"/></svg>`,
 cloud:`<svg width="38" height="30" viewBox="0 0 38 30"><circle cx="25" cy="10" r="6" fill="#f9a826"/><path d="M9 26a7 7 0 0 1 1-14 9 9 0 0 1 17 2 6 6 0 0 1 1 12z" fill="#cfe3f2"/></svg>`,
 over:`<svg width="38" height="28" viewBox="0 0 38 28"><path d="M9 24a7 7 0 0 1 1-14 9 9 0 0 1 17 2 6 6 0 0 1 1 12z" fill="#b9d3e8"/></svg>`,
 rain:`<svg width="38" height="34" viewBox="0 0 38 34"><path d="M9 20a7 7 0 0 1 1-14 9 9 0 0 1 17 2 6 6 0 0 1 1 12z" fill="#cfe3f2"/><path d="M13 24l-2 5M20 24l-2 5M27 24l-2 5" stroke="#39a6e0" stroke-width="2.6" stroke-linecap="round"/></svg>`};
function buildForecast(){

/* ---------- touch ripple (finger taps) ---------- */
const TAPS={home:[],aq:[],chart:[],forecast:[],alerts:[[0.75,513,369],[1.85,644,369]]};
function drawTouch(t){
  const el=document.getElementById('touch'); if(!el||P.get('notouch')) return; let h='';
  for(const [ta,x,y] of TAPS[PAGE]||[]){ if(t<ta-0.15||t>ta+0.7) continue;
    const u=pr(t,ta,ta+0.55); const R=lerp(16,60,u), o=t<ta?pr(t,ta-0.15,ta)*0.5:(1-u)*0.55;
    h+=`<div style="position:absolute;left:${x-R}px;top:${y-R}px;width:${2*R}px;height:${2*R}px;border-radius:50%;background:rgba(255,255,255,${(o*0.6).toFixed(3)});box-shadow:0 0 0 3px rgba(242,135,58,${o.toFixed(3)})"></div>`;}
  el.innerHTML=h;
}
