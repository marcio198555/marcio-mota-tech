<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>UGC ad overlay</title>
<!-- Transparent graphics layer for a 1080x1920 ad, rendered to RGBA frames by render_overlay.js and composited over
     the footage. It is deterministic: renderFrame(t) draws time t. Word times come from timeline.js (window.TL,
     written by align_words.py --js, with the voice-over offset already added).
     To adapt it: edit CFG (cuts and caption heights per shot, chips, CTA, end card) and add your own sections in
     renderFrame. Keep text off the product, and inside the safe zone: y 250-1550 and x 60-1020 (TikTok/Reels
     cover the top bar, the right-hand buttons and the caption area at the bottom).
     Variants: open the page as overlay.html?noavatar and branch on NOAV, like the cut list. -->
<style>
@font-face{font-family:'Montserrat';font-weight:100 900;font-display:block;src:url(fonts/montserrat-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:'Montserrat';font-weight:100 900;font-display:block;src:url(fonts/montserrat-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+1EF2-1EFF,U+20A0-20AB,U+20AD-20C0,U+2C60-2C7F,U+A720-A7FF;}
:root{--accent:#FF7A00;--yellow:#FFE14D;--ink:#121826}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
body{font-family:'Montserrat',sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}
.em{font-family:'Noto Color Emoji',sans-serif;font-weight:400;line-height:1}
.abs{position:absolute;left:0;top:0;transform-origin:50% 50%}
.fill{position:absolute;inset:0}
.chip{position:absolute;left:0;top:0;display:flex;align-items:center;gap:14px;padding:14px 30px 14px 18px;border-radius:999px;background:#fff;
  font-weight:800;font-size:44px;letter-spacing:-.5px;white-space:nowrap;box-shadow:0 16px 34px rgba(0,0,0,.32);opacity:0;visibility:hidden}
.chip .em{font-size:50px}
.chip.dark{background:#0f1726;color:#fff}
.capbox{position:absolute;left:60px;width:960px;text-align:center;font-weight:900;font-size:76px;line-height:1.08;text-transform:uppercase;letter-spacing:-1.5px}
.w{display:inline-block;position:relative;margin:0 .12em;transform-origin:50% 70%}
.w .s,.w .f{display:block;white-space:nowrap}
.w .s{position:absolute;left:0;top:0;color:#000;-webkit-text-stroke:16px #000;text-shadow:0 8px 0 rgba(0,0,0,.45)}
.w .f{position:relative;color:#fff}
.w.on .f{color:var(--yellow)}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
</style>
</head>
<body>
<div id="stage" class="fill">
 <div class="fill" id="vign" style="background:radial-gradient(125% 80% at 50% 48%,rgba(0,0,0,0) 56%,rgba(0,0,0,.28) 100%)"></div>
 <div id="chips"></div>
 <div class="abs" id="cta" style="width:1080px;text-align:center;opacity:0;visibility:hidden">
   <span style="display:inline-flex;align-items:center;gap:14px;background:var(--accent);color:#fff;font-weight:900;font-size:54px;letter-spacing:-1px;padding:20px 44px 20px 34px;border-radius:999px;box-shadow:0 18px 40px rgba(0,0,0,.4)"><span class="em" style="font-size:58px">👇</span><span id="ctaText"></span></span>
 </div>
 <div class="abs" id="end" style="width:1080px;height:1920px;opacity:0;visibility:hidden;overflow:hidden">
   <div class="fill" style="background:linear-gradient(165deg,rgba(255,176,71,.86) 0%,rgba(255,122,0,.90) 52%,rgba(238,90,0,.95) 100%)"></div>
   <div class="abs" id="eTitle" style="top:210px;width:1080px;text-align:center;color:#fff;font-weight:900;font-size:124px;letter-spacing:-4px;line-height:1;text-shadow:0 10px 0 rgba(150,50,0,.35);opacity:0"></div>
   <div class="abs" id="eSub" style="top:356px;width:1080px;text-align:center;color:#fff;font-weight:800;font-size:44px;opacity:0"></div>
   <img class="abs" id="eHero" style="left:130px;top:440px;width:820px;opacity:0">
   <div class="abs" id="eCta" style="top:1300px;width:1080px;text-align:center;opacity:0">
     <span style="display:inline-flex;align-items:center;gap:14px;background:#fff;color:#e85d00;font-weight:900;font-size:52px;padding:20px 44px 20px 34px;border-radius:999px;box-shadow:0 18px 40px rgba(120,40,0,.35)"><span class="em" style="font-size:58px">👇</span><span id="eCtaText"></span></span>
   </div>
 </div>
 <div id="captions"></div>
 <div id="flash"></div>
</div>
<script src="timeline.js"></script>
<script>
const NOAV=location.search.includes('noavatar');
/* ================= edit this ================= */
const CFG={
  dur:54.0,
  reveal:5.07,                                  // music drop / product reveal: white flash
  cuts:[0,3.55,5.05,47.95,51.40,54],            // shot boundaries (video seconds), same as the shot list
  capY:[1460,1530,455,1120,1500],               // caption centre per shot: keep the product visible
  chips:[                                       // feature chips: pop in at t0 (or at a word), leave at t1
    {text:'Écran tactile 7"',emoji:'👆',t0:{line:3,word:6},t1:10.2,x:'center',y:250},
  ],
  cta:{text:'LIEN JUSTE EN DESSOUS',t0:{line:-1,word:0},t1:null,y:1500},   // line -1 = last script line
  end:{t:51.40,title:'PRODUIT X',sub:'Ce qu’il fait, en une ligne',hero:'hero@2x.png',cta:'LIEN JUSTE EN DESSOUS'},
  hideCaptions:[[51.40,99]],                    // ranges where captions give way (end card, big badges)
};
/* ============================================ */
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), lerp=(a,b,u)=>a+(b-a)*u;
const E={lin:u=>u,outC:u=>1-Math.pow(1-u,3),inC:u=>u*u*u,ioS:u=>-(Math.cos(Math.PI*u)-1)/2,outB:u=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(u-1,3)+c1*Math.pow(u-1,2)}};
const pr=(t,a,b,e=E.lin)=>e(clamp((t-a)/(b-a)));
const W=(window.TL||{words:[]}).words, NL=W.length?Math.max(...W.map(w=>w.p))+1:0;
const at=v=>typeof v==='number'?v:(W.find(w=>w.p===(v.line<0?NL+v.line:v.line)&&w.i===v.word)||{t:0}).t;   // time or {line,word}
function tf(el,{x=0,y=0,s=1,r=0,o=null}={}){el.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${r.toFixed(3)}deg) scale(${s.toFixed(4)})`;if(o!==null)el.style.opacity=clamp(o).toFixed(3);}
const show=(el,v)=>{el.style.visibility=v?'visible':'hidden'};
function pop(el,t,a,b,{dy=-40,r0=-6,from=.4,dur=.14}={}){         // springy entrance at a, quick exit at b
  if(t<a||t>b+dur){show(el,false);el.style.opacity=0;return false;}
  show(el,true);const u=pr(t,a,a+.38,E.outB),o=pr(t,a,a+.12),m=pr(t,a,a+.3,E.outC),q=pr(t,b,b+dur,E.inC);
  tf(el,{y:dy*(1-m),s:lerp(from,1,u)*lerp(1,.8,q),r:r0*(1-m),o:o*(1-q)});return true;}
const shotIx=t=>{let k=0;while(k<CFG.cuts.length-2&&t>=CFG.cuts[k+1])k++;return k;};

/* ---------- captions: 2-3 words per chunk (<= 17 characters), current word in yellow ---------- */
const disp=s=>s.replace(/[,.…:;]+$/u,'').replace(/ /g,' ');
const CH=[];{let cur=[],prevP=-1;const flush=()=>{if(cur.length){CH.push(cur);cur=[];}};
  for(const w of W){if(w.p!==prevP)flush();prevP=w.p;const len=cur.reduce((n,x)=>n+disp(x.w).length+1,0)+disp(w.w).length;
    if(cur.length>=3||len>17)flush();cur.push(w);if(/[,.…:!?]$/u.test(w.w)&&cur.length>=2)flush();}flush();}
CH.forEach((c,k)=>{c.s=c[0].t;const nx=CH[k+1],le=c[c.length-1].e;c.e=nx?(nx[0].t-le>0.45?le+0.3:nx[0].t):le+0.6;});
const wordHTML=txt=>{const h=txt.toUpperCase();return `<span class="w"><span class="s">${h}</span><span class="f">${h}</span></span>`;};
let curChunk=-1;
function drawCaptions(t){
  let k=CH.findIndex(c=>t>=c.s-0.02&&t<c.e);
  if(CFG.hideCaptions.some(([a,b])=>t>=a&&t<b)) k=-1;
  if(k!==curChunk){curChunk=k;$('captions').innerHTML=k<0?'':`<div class="capbox" id="capbox">${CH[k].map(w=>wordHTML(disp(w.w))).join(' ')}</div>`;}
  if(k<0)return;
  const box=$('capbox'),c=CH[k];box.style.top=(CFG.capY[shotIx(t)]-box.offsetHeight/2)+'px';
  box.querySelectorAll('.w').forEach((el,i)=>{const w=c[i],a=w.t-0.04;
    if(t<a){el.style.opacity=0;el.style.transform='scale(.5)';return;}
    const u=pr(t,a,a+.2,E.outB),next=c[i+1],on=!next||t<next.t-0.04;el.style.opacity=pr(t,a,a+.06);el.classList.toggle('on',on);
    el.style.transform=`translateY(${(1-pr(t,a,a+.18,E.outC))*18}px) scale(${lerp(.55,1,u)*(on?1.06:1)})`;});
  box.style.opacity=1-pr(t,c.e-0.08,c.e);
}

/* ---------- chips, CTA, end card ---------- */
function layout(){
  $('chips').innerHTML=CFG.chips.map((c,i)=>`<div class="chip${c.dark?' dark':''}" id="chip${i}"><span class="em">${c.emoji||''}</span><span>${c.text}</span></div>`).join('');
  CFG.chips.forEach((c,i)=>{const el=$('chip'+i);el.style.left=(c.x==='center'?540-el.offsetWidth/2:c.x)+'px';el.style.top=c.y+'px';});
  $('ctaText').textContent=CFG.cta.text;$('cta').style.top=CFG.cta.y+'px';
  $('eTitle').textContent=CFG.end.title;$('eSub').textContent=CFG.end.sub;$('eCtaText').textContent=CFG.end.cta;
}
function renderFrame(t){
  CFG.chips.forEach((c,i)=>pop($('chip'+i),t,at(c.t0)-0.06,c.t1));
  const ca=at(CFG.cta.t0);
  if(pop($('cta'),t,ca,CFG.cta.t1??CFG.end.t-0.05,{dy:60,r0:0,from:.5})&&t>ca+.4) $('cta').style.transform+=` translateY(${(Math.abs(Math.sin((t-ca)*5.5))*-12).toFixed(1)}px)`;
  const a=CFG.end.t,end=$('end');show(end,t>=a);end.style.opacity=pr(t,a,a+.25);
  tf($('eTitle'),{y:(1-pr(t,a+.1,a+.5,E.outB))*-60,o:pr(t,a+.1,a+.3)});tf($('eSub'),{o:pr(t,a+.3,a+.5)});
  tf($('eHero'),{y:(1-pr(t,a+.05,a+.6,E.outB))*120,s:lerp(.9,1,pr(t,a+.05,a+.6,E.outC))+0.02*pr(t,a+.6,CFG.dur,E.lin),o:pr(t,a+.05,a+.25)});
  if(pop($('eCta'),t,a+.45,99,{dy:60,r0:0,from:.5})&&t>a+.85) $('eCta').style.transform+=` translateY(${(Math.abs(Math.sin((t-a-.45)*5.5))*-10).toFixed(1)}px)`;
  $('vign').style.opacity=(1-pr(t,a,a+.2)).toFixed(3);
  drawCaptions(t);
  const fl=Math.max(Math.exp(-Math.pow((t-CFG.reveal)/.08,2))*.55*(t>=CFG.reveal-.1?1:0),Math.exp(-Math.pow((t-a-.02)/.07,2))*.4*(t>=a-.1?1:0));
  $('flash').style.opacity=fl.toFixed(3);
}
window.renderFrame=renderFrame;window.DUR=CFG.dur;
$('eHero').src=CFG.end.hero;
window.ready=Promise.all([document.fonts.load('900 80px Montserrat'),document.fonts.load('800 44px Montserrat'),document.fonts.load('48px "Noto Color Emoji"'),
  $('eHero').decode().catch(()=>{})]).then(()=>document.fonts.ready).then(()=>{layout();renderFrame(0);return true;});
</script>
</body>
</html>
