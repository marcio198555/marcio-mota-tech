name: voix-off-bridge
on:
  push:
    branches: [claude/voix-off-reel]
permissions:
  contents: write
jobs:
  fetch:
    if: "!contains(github.event.head_commit.message, '[skip-bridge]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download voice-over
        env:
          VO_URL: 'https://storage.googleapis.com/xi-backend/database/workspace/e26e5920fc1f46a59140ce6b6d123ff6/content_generation/vDKMddFVliA2ei95PjIv/JnfCUlMTHVohlcoSnMmQ/content.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=xi-backend-prod%40xi-labs.iam.gserviceaccount.com%2F20261020%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20261020T210942Z&X-Goog-Expires=7200&X-Goog-SignedHeaders=host&X-Goog-'
        run: |
          mkdir -p out
          curl -fL --retry 3 -o out/voix_off.mp3 "$VO_URL"
          ls -la out
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add out/voix_off.mp3
          git commit -m "voix off [skip-bridge]"
          git push
