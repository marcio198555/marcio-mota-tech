name: voix-off-bridge
on:
  push:
    branches: [claude/voix-off-reel]
permissions:
  contents: write
jobs:
  fetch:
    if: "!contains(github.event.head_commit.message, '[skip-bridge]')"
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Download listed URLs
        run: |
          mkdir -p out
          if [ -f bridge/urls.txt ]; then
            while read -r name url; do
              [ -z "$name" ] && continue
              curl -fL --retry 3 -o "out/$name" "$url" && echo "OK $name" || echo "FAILED $name"
            done < bridge/urls.txt
          fi
      - name: Run job
        continue-on-error: true
        run: |
          if [ -f bridge/job.sh ]; then bash bridge/job.sh 2>&1 | tee out/job_${GITHUB_SHA::7}.log; fi
      - name: Commit outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f out || true
          git commit -m "bridge output [skip-bridge]" || echo "nothing to commit"
          git pull --rebase -X theirs origin claude/voix-off-reel || true
          git push origin HEAD:claude/voix-off-reel
